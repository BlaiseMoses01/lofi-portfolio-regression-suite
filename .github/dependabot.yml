version: 2

# Weekly grouped update PRs for npm devDependencies and the GitHub Actions
# used by the workflows. Playwright is grouped on its own so browser bumps
# land (and get tested) separately from tooling bumps.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright*"
      lint-and-format:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "husky"
          - "lint-staged"
      other:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
